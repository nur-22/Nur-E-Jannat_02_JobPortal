{% extends 'base.html' %}

{% block title %}Job Seeker Profile{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">

                <h2 class="text-primary mb-4">Job Seeker Profile</h2>

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit" class="btn btn-primary">
                        Save Profile
                    </button>

                    <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                        Back to Dashboard
                    </a>
                </form>
                    {% if form.instance.resume %}
                        <hr class="my-4">

                        <h4 class="text-primary">My Uploaded CV</h4>

                        <div class="mt-3">
                            <object
                                data="{{ form.instance.resume.url }}"
                                type="application/pdf"
                                width="100%"
                                height="600px">

                                <p>
                                    Your browser cannot display the PDF.
                                    <a href="{{ form.instance.resume.url }}" target="_blank">
                                        Click here to view your CV.
                                    </a>
                                </p>
                            </object>
                        </div>

                        <div class="mt-3">
                            <a href="{{ form.instance.resume.url }}"
                            target="_blank"
                            class="btn btn-outline-primary">
                                Open CV
                            </a>
                        </div>
                    {% endif %}
            </div>
        </div>

    </div>
</div>

{% endblock %}
